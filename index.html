<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="モザイク">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>モザイク</title>
</head>
<body>
  <main class="app-shell">
    <section class="hero-card">
      <div>
        <p class="eyebrow">Offline PWA</p>
        <h1>モザイク</h1>
        <p class="subtitle">画像は端末内で処理され、外部へ送信しません。</p>
      </div>
      <label class="button primary file-button">
        写真を選ぶ
        <input id="fileInput" type="file" accept="image/*" hidden>
      </label>
    </section>

    <section id="editorCard" class="editor-card hidden">
      <div class="stage-card">
        <div class="stage-toolbar">
          <div class="zoom-pill">拡大率 <span id="zoomLabel">100%</span></div>
          <button id="resetViewBtn" class="button ghost small">表示を戻す</button>
        </div>

        <div id="stage" class="stage">
          <canvas id="viewCanvas"></canvas>
          <div id="emptyHint" class="empty-hint">写真を選ぶとここに表示されます</div>
        </div>
      </div>

      <div class="controls-grid">
        <div class="control-block">
          <label for="modeSelect">モザイク種類</label>
          <select id="modeSelect">
            <option value="pixelate">四角モザイク</option>
            <option value="blur">ぼかし</option>
            <option value="black">黒塗り</option>
          </select>
        </div>

        <div class="control-block">
          <label for="brushSize">ブラシサイズ <span id="brushValue">42</span></label>
          <input id="brushSize" type="range" min="12" max="160" value="42">
        </div>

        <div class="control-block">
          <label for="strengthRange">強さ <span id="strengthValue">18</span></label>
          <input id="strengthRange" type="range" min="4" max="48" value="18">
        </div>
      </div>

      <div class="action-row">
        <button id="undoBtn" class="button ghost">戻す</button>
        <button id="redoBtn" class="button ghost">やり直し</button>
        <button id="clearBtn" class="button ghost">全消去</button>
        <button id="saveBtn" class="button primary">画像を保存</button>
      </div>

      <p class="help-text">
        1本指でモザイク、2本指で拡大・縮小 / 移動
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
